<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reading Progress - Book Reading Community</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #3e6bb7 0%, #4562a6 100%);
      color: #2d2d2d;
      min-height: 100vh;
    }
    .container {
      max-width: 1080px;
      margin: 40px auto;
      padding: 22px;
      background: rgba(255,255,255,0.96);
      border-radius: 18px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.12);
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }
    h1 {
      margin: 0;
      font-size: 2rem;
      color: #1d1d1d;
    }
    .nav-links {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .nav-links a {
      text-decoration: none;
      color: white;
      background: #5b6ad6;
      padding: 10px 16px;
      border-radius: 10px;
      transition: background 0.2s ease, transform 0.2s ease;
    }
    .nav-links a:hover {
      background: #4e58bf;
      transform: translateY(-2px);
    }
    .progress-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }
    .progress-card {
      background: white;
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 14px 38px rgba(0,0,0,0.08);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .progress-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 44px rgba(0,0,0,0.12);
    }
    .progress-title {
      margin: 0 0 10px;
      font-size: 1.15rem;
      color: #242424;
    }
    .progress-meta {
      font-size: 0.95rem;
      color: #555;
      margin-bottom: 16px;
    }
    .progress-bar {
      position: relative;
      height: 12px;
      border-radius: 999px;
      background: #f0f0f5;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
      border-radius: inherit;
    }
    .progress-status {
      display: inline-block;
      font-weight: 700;
      color: #4a4a4a;
    }
    .action-section {
      margin-bottom: 24px;
      display: flex;
      justify-content: center;
    }
    .form-card {
      width: 100%;
      max-width: 650px;
      background: #f7f9ff;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 14px 32px rgba(74, 102, 206, 0.08);
      border: 1px solid rgba(102, 126, 234, 0.14);
    }
    .form-card h2 {
      margin-top: 0;
      margin-bottom: 16px;
      color: #293b72;
    }
    .form-card label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
      color: #3d4b78;
    }
    .form-card input,
    .form-card select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid #d8dff6;
      margin-bottom: 16px;
      font-size: 1rem;
      color: #2d2d2d;
      background: white;
    }
    .form-card button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 22px;
      border: none;
      border-radius: 12px;
      background: #667eea;
      color: white;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease;
    }
    .form-card button:hover {
      transform: translateY(-2px);
      background: #5b5ddf;
    }
    .loading,
    .no-data {
      text-align: center;
      padding: 42px;
      font-size: 1.05rem;
      color: #444;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Reading Progress</h1>
        <p>Track your current reading milestones and update progress as you go.</p>
      </div>
      <div class="nav-links">
        <a href="/dashboard">Dashboard</a>
        <a href="/books">Books</a>
        <a href="/groups">Groups</a>
      </div>
    </header>

    <div class="action-section">
      <div class="form-card">
        <h2>Submit Progress</h2>
        <form id="submitProgressForm">
          <label for="bookId">Book ID</label>
          <input id="bookId" type="number" min="1" placeholder="Enter book ID" required>
          <label for="currentPage">Current Page</label>
          <input id="currentPage" type="number" min="0" placeholder="Current page" required>
          <label for="totalPages">Total Pages</label>
          <input id="totalPages" type="number" min="1" placeholder="Total pages (optional)">
          <label for="progressStatus">Status</label>
          <select id="progressStatus">
            <option value="reading">Reading</option>
            <option value="paused">Paused</option>
            <option value="completed">Completed</option>
          </select>
          <button type="submit">Submit Progress</button>
        </form>
      </div>
    </div>

    <div id="loading" class="loading">Loading your progress...</div>
    <div id="progressList" class="progress-grid" style="display:none;"></div>
    <div id="noProgress" class="no-data" style="display:none;">No progress entries found yet. Start reading and track your progress!</div>
  </div>

  <script src="{{ url_for('static', filename='js/utils.js') }}"></script>
  <script src="{{ url_for('static', filename='js/alerts.js') }}"></script>
  <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
  <script>
    function formatDate(value) {
      if (!value) return 'Unknown';
      const date = new Date(value);
      return date.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
    }

    async function loadProgress() {
      const user = Utils.requireAuth();
      if (!user) return;

      const loading = document.getElementById('loading');
      const progressList = document.getElementById('progressList');
      const noProgress = document.getElementById('noProgress');
      loading.style.display = 'block';
      progressList.style.display = 'none';
      noProgress.style.display = 'none';

      try {
        const [booksResponse, progressResponse] = await Promise.all([
          fetch('/api/books/?json=1'),
          fetch('/api/progress?json=1', {
            headers: { 'Authorization': 'Bearer ' + user.token }
          })
        ]);

        const booksData = await booksResponse.json();
        const progressData = await progressResponse.json();
        const allBooks = Array.isArray(booksData) ? booksData : (booksData.books || []);
        const progressItems = Array.isArray(progressData) ? progressData : (progressData.progress || progressData || []);
        const bookMap = new Map(allBooks.map(book => [book.id, book.title]));

        loading.style.display = 'none';
        if (!progressItems.length) {
          noProgress.style.display = 'block';
          return;
        }

        progressList.innerHTML = progressItems.map(item => {
          const bookTitle = Utils.escapeHtml(bookMap.get(item.book_id) || `Book #${item.book_id}`);
          const current = Number(item.current_page || 0);
          const total = Number(item.total_pages || 0);
          const percent = total > 0 ? Math.round((current / total) * 100) : 0;
          const status = item.status ? item.status.charAt(0).toUpperCase() + item.status.slice(1) : 'Reading';

          return `
            <div class="progress-card">
              <h2 class="progress-title">${bookTitle}</h2>
              <p class="progress-meta">Status: <span class="progress-status">${status}</span> · Last updated: ${formatDate(item.last_read)}</p>
              <div class="progress-bar"><div class="progress-fill" style="width:${percent}%"></div></div>
              <p>${current} / ${total || 'Unknown'} pages · ${percent}% complete</p>
            </div>`;
        }).join('');

        progressList.style.display = 'grid';
      } catch (error) {
        loading.textContent = 'Unable to load progress. Please refresh the page.';
        console.error(error);
      }
    }

    document.getElementById('submitProgressForm').addEventListener('submit', async function (event) {
      event.preventDefault();
      const user = Utils.requireAuth();
      if (!user) return;

      const bookId = Number(document.getElementById('bookId').value);
      const currentPage = Number(document.getElementById('currentPage').value);
      const totalPagesValue = document.getElementById('totalPages').value;
      const totalPages = totalPagesValue ? Number(totalPagesValue) : undefined;
      const status = document.getElementById('progressStatus').value;

      if (!bookId || currentPage < 0) {
        Alerts.error('Please enter a valid book ID and current page.');
        return;
      }

      try {
        const response = await fetch('/api/progress', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + user.token
          },
          body: JSON.stringify({
            book_id: bookId,
            current_page: currentPage,
            total_pages: totalPages,
            status
          })
        });

        const result = await response.json();
        if (!response.ok) {
          Alerts.error(result.message || 'Unable to submit progress.');
          return;
        }

        Alerts.success('Progress submitted successfully.');
        document.getElementById('submitProgressForm').reset();
        loadProgress();
      } catch (error) {
        console.error('Submit progress error:', error);
        Alerts.error('Network error while submitting progress.');
      }
    });

    document.addEventListener('DOMContentLoaded', loadProgress);
  </script>
</body>
</html>
