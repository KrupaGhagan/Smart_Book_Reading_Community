<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Catalog - Book Reading Community</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        header h1 {
            color: #333;
            font-size: 2em;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .search-box {
            display: flex;
            gap: 10px;
            width: 300px;
        }
        
        .search-box input {
            flex: 1;
            padding: 10px 15px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        
        .search-box input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .search-box button {
            padding: 10px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        
        .search-box button:hover {
            background: #764ba2;
        }
        
        .filter-section {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px 30px;
            border-radius: 10px;
            margin-bottom: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .filter-section label {
            font-weight: bold;
            color: #333;
        }
        
        .filter-section select {
            padding: 8px 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
            background: white;
            transition: border-color 0.3s;
        }
        
        .filter-section select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }
        
        .book-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            height: 100%;
            opacity: 0;
            animation: fadeInUp 0.45s ease forwards;
        }
        
        .book-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.25);
        }
        
        .book-cover {
            height: 240px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            position: relative;
            overflow: hidden;
            min-height: 220px;
        }

        .book-cover-image {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .book-cover-fallback {
            z-index: 1;
            font-size: 90px;
            color: white;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        .book-cover-title {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 2;
            padding: 12px 14px;
            background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.75) 100%);
            color: #fff;
            font-size: 0.95rem;
            font-weight: 700;
            line-height: 1.2;
            max-height: 3em;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .book-cover::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, transparent 0%, rgba(0, 0, 0, 0.25) 100%);
        }
        
        .book-content {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        
        .book-title {
            font-size: 1.1em;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .book-author {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 12px;
        }
        
        .book-category {
            display: inline-block;
            background: #f0f0f0;
            color: #667eea;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75em;
            font-weight: bold;
            margin-bottom: 12px;
            width: fit-content;
        }
        
        .book-rating {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 12px;
            font-size: 0.9em;
        }
        
        .stars {
            color: #ffc107;
        }

        .review-count {
            font-size: 0.8em;
            color: #555;
            margin-left: 10px;
        }

        .book-description {
            font-size: 0.85em;
            color: #666;
            margin-bottom: 15px;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            flex-grow: 1;
        }
        
        .book-actions {
            display: flex;
            gap: 10px;
            margin-top: auto;
        }
        
        .btn-read {
            flex: 1;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9em;
            transition: all 0.3s;
            text-decoration: none;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .btn-read:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        .btn-read:disabled,
        .btn-read.disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-details {
            flex: 1;
            padding: 12px;
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9em;
            transition: all 0.3s;
        }

        .btn-read-pdf {
            background: linear-gradient(135deg, #ff7e5f 0%, #feb47b 100%);
            color: white;
            border: none;
        }

        .btn-read-pdf:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(255, 126, 95, 0.35);
        }

        .btn-review {
            background: #f4f4f4;
            color: #333;
            border: 2px solid #ddd;
        }

        .btn-review:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .btn-details:hover {
            background: #667eea;
            color: white;
        }
        
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: white;
            font-size: 1.2em;
        }
        
        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .no-results {
            background: rgba(255, 255, 255, 0.95);
            padding: 60px;
            border-radius: 10px;
            text-align: center;
            color: #666;
            font-size: 1.1em;
        }
        
        .stats {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px 30px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 20px;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }
        
        .stat-label {
            color: #666;
            font-size: 0.9em;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 Book Catalog</h1>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search books...">
                <button onclick="searchBooks()">Search</button>
            </div>
        </header>
        
        <div class="filter-section">
            <label for="categoryFilter">Filter by Category:</label>
            <select id="categoryFilter" onchange="filterBooks()">
                <option value="">All Categories</option>
                <option value="Programming">Programming</option>
                <option value="Manga">Manga</option>
                <option value="Fiction">Fiction</option>
                <option value="Comics">Comics</option>
                <option value="Philosophy">Philosophy</option>
                <option value="Self-Help">Self-Help</option>
                <option value="Science">Science</option>
                <option value="History">History</option>
                <option value="Educational">Educational</option>
            </select>
        </div>
        
        <div class="stats" id="stats"></div>
        
        <div id="loading" class="loading" style="display: none;">Loading books...</div>
        <div id="booksList" class="books-grid"></div>
        <div id="noResults" class="no-results" style="display: none;">No books found. Try a different search.</div>
    </div>

    <script>
        let allBooks = [];
        let currentFilter = '';
        
        async function loadBooks() {
            try {
                document.getElementById('loading').style.display = 'block';
                document.getElementById('booksList').innerHTML = '';
                
                const response = await fetch('/api/books/?json=1');
                let books = await response.json();
                // ensure we always work with an array (API might wrap results)
                if (!Array.isArray(books)) {
                    books = books && books.books ? books.books : [];
                }
                allBooks = books;
                
                document.getElementById('loading').style.display = 'none';
                updateStats();
                displayBooks(books);
            } catch (error) {
                console.error('Error loading books:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('booksList').innerHTML = '<p style="color: red;">Error loading books</p>';
            }
        }
        
        function displayBooks(books) {
            const container = document.getElementById('booksList');
            
            if (books.length === 0) {
                container.style.display = 'none';
                document.getElementById('noResults').style.display = 'block';
                return;
            }
            
            container.style.display = 'grid';
            document.getElementById('noResults').style.display = 'none';
            
            container.innerHTML = books.map(book => `
                <div class="book-card">
                    <div class="book-cover">
                        ${book.cover_url ? `<img class="book-cover-image" src="${escapeHtml(book.cover_url)}" alt="${escapeHtml(book.title)} cover" onerror="this.style.display='none'; this.closest('.book-cover').querySelector('.book-cover-fallback').style.display='flex';">` : ''}
                        <div class="book-cover-fallback" style="display: ${book.cover_url ? 'none' : 'flex'};">
                            ${escapeHtml(book.cover || '📖')}
                        </div>
                        <div class="book-cover-title">${escapeHtml(book.title)}</div>
                    </div>
                    <div class="book-content">
                        <h3 class="book-title">${escapeHtml(book.title)}</h3>
                        <p class="book-author">by ${escapeHtml(book.author)}</p>
                        <span class="book-category">${escapeHtml(book.genres || 'General')}</span>
                        <div class="book-rating">
                            <span class="stars">★ ${typeof book.average_rating === 'number' ? book.average_rating.toFixed(1) : '0.0'}</span>
                            <span class="review-count">${(book.reviews && book.reviews.length) ? `${book.reviews.length} review${book.reviews.length === 1 ? '' : 's'}` : 'No reviews yet'}</span>
                        </div>
                        <p class="book-description">${escapeHtml(book.description || 'No description available')}</p>
                        <div class="book-actions">
                            ${book.read_url ? `
                                <a href="${escapeHtml(book.read_url)}" target="_blank" class="btn-read btn-read-pdf">📖 Read PDF</a>
                            ` : `
                                <button class="btn-read disabled" disabled>No Link</button>
                            `}
                            <button class="btn-review" onclick="openReview(${book.id})">✍️ Review</button>
                            <button class="btn-details" onclick="viewDetails(${book.id})">Details</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }
        
        function searchBooks() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allBooks.filter(book => 
                book.title.toLowerCase().includes(query) ||
                book.author.toLowerCase().includes(query)
            );
            displayBooks(filtered);
        }
        
        function filterBooks() {
            const category = document.getElementById('categoryFilter').value;
            currentFilter = category;
            const filtered = category ? allBooks.filter(book => book.genres === category) : allBooks;
            displayBooks(filtered);
        }
        
        function updateStats() {
            const categories = [...new Set(allBooks.map(b => b.genres))].length;
            const withLinks = allBooks.filter(b => b.read_url).length;
            
            document.getElementById('stats').innerHTML = `
                <div class="stat-item">
                    <div class="stat-number">${allBooks.length}</div>
                    <div class="stat-label">Total Books</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">${categories}</div>
                    <div class="stat-label">Categories</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">${withLinks}</div>
                    <div class="stat-label">Readable Online</div>
                </div>
            `;
        }
        
        function viewDetails(bookId) {
            const book = allBooks.find(b => b.id === bookId);
            if (book) {
                alert(`${book.title}\n\nAuthor: ${book.author}\nISBN: ${book.isbn}\n\n${book.description}`);
            }
        }

        async function openReview(bookId) {
            const user = Utils.getCurrentUser();
            if (!user) {
                if (confirm('You need to log in to submit a review. Go to login page?')) {
                    window.location.href = window.BOOK_PLATFORM_ROUTES?.login || '/login';
                }
                return;
            }

            const book = allBooks.find(b => b.id === bookId);
            if (!book) return;

            const rating = parseInt(prompt('Rate this book from 1 to 5')); 
            if (!rating || rating < 1 || rating > 5) {
                alert('Please enter a valid rating between 1 and 5.');
                return;
            }

            const comment = prompt('Write your review for "' + book.title + '"');
            if (comment === null) return;

            try {
                const response = await fetch('/api/reviews/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + user.token
                    },
                    body: JSON.stringify({
                        book_id: bookId,
                        rating,
                        comment
                    })
                });
                const result = await response.json();
                if (response.ok) {
                    alert('Review submitted successfully.');
                } else {
                    alert(result.message || 'Review submission failed.');
                }
            } catch (error) {
                console.error('Review error:', error);
                alert('Network error while submitting review.');
            }
        }
        
        function escapeHtml(text) {
            if (text === null || text === undefined) return '';
            const s = String(text);
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return s.replace(/[&<>"']/g, m => map[m]);
        }
        
        // Load books on page load
        document.addEventListener('DOMContentLoaded', loadBooks);
    </script>
</body>
</html>
